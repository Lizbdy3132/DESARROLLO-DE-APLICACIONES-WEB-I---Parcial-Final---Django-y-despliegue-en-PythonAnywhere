{% extends "myapp/base.html" %}

{% block titulo %}Crear programa{% endblock %}

{% block contenido %}
    <h2>Registrar programa</h2>
    {% for mensaje in messages %}
        <p>{{ mensaje }}</p>
    {% endfor %}
    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button type="submit">Guardar</button>
    </form>
{% endblock %}
